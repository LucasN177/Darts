<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <title>Darts</title>
    <script>
        // GitHub Pages kennt keine SPA-Routen: Pfad unterhalb des App-Ordners als ?p= an index.html weitergeben.
        // segmentCount = Anzahl Pfadsegmente der Base-URL (z.B. 1 für /Darts/).
        var segmentCount = 1;
        var l = window.location;
        var segments = l.pathname.split('/').filter(Boolean);
        var base = '/' + segments.slice(0, segmentCount).join('/') + (segmentCount > 0 ? '/' : '');
        var rest = '/' + segments.slice(segmentCount).join('/');
        l.replace(l.protocol + '//' + l.host + base + '?p=' + encodeURIComponent(rest) + l.hash);
    </script>
</head>
<body></body>
</html>
