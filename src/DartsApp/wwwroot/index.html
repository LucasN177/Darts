<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141417" />
    <meta name="description" content="Darts zählen und trainieren – allein, zu mehreren oder gegen den Computer: X01, Cricket, Around the Clock, Shanghai, Bob's 27, 121 Checkout, High Score, Killer, Halve-It, Baseball und Gotcha." />
    <title>Darts</title>
    <base href="/" />
    <script>
        // Hell-/Dunkelmodus schon für den Ladebildschirm übernehmen (Einstellung aus der App).
        try {
            var ui = JSON.parse(localStorage.getItem("darts.ui") || "null");
            if (ui && ui.darkMode === false) document.documentElement.classList.add("theme-light");
        } catch (e) { }

        // GitHub Pages SPA-Routing: 404.html leitet tiefe Links als ?p=/pfad hierher um.
        (function (l) {
            var match = l.search.match(/[?&]p=([^&]*)/);
            if (match) {
                var path = decodeURIComponent(match[1]).replace(/^\//, '');
                var base = document.querySelector('base').getAttribute('href');
                window.history.replaceState(null, '', base + path + l.hash);
            }
        })(window.location);
    </script>
    <link rel="preload" id="webassembly" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <!-- Ladebildschirm: wird ersetzt, sobald Blazor die App rendert -->
        <div class="splash" role="status" aria-live="polite" aria-label="Darts wird geladen">
            <div class="splash-logo">
                <svg class="splash-ring" viewBox="0 0 120 120" aria-hidden="true">
                    <circle class="splash-ring-track" cx="60" cy="60" r="56" />
                    <circle class="splash-ring-arc" cx="60" cy="60" r="56" pathLength="100" />
                </svg>
                <img class="splash-board" src="favicon.svg" alt="" width="96" height="96" />
            </div>
            <h1 class="splash-title">Darts</h1>
            <p class="splash-tagline">Zählen · Trainieren · Gewinnen</p>
            <div class="splash-progress" aria-hidden="true"><div class="splash-progress-bar"></div></div>
            <p class="splash-percent"></p>
            <p class="splash-credit">by Lucas Nagelsmann</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        Es ist ein Fehler aufgetreten.
        <a href="." class="reload">Neu laden</a>
        <span class="dismiss" title="Schließen"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></span>
    </div>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
